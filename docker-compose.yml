services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-public_data}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-change_me_admin}
      EXTRACTOR_DB_PASSWORD: ${EXTRACTOR_DB_PASSWORD:-change_me_extractor}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-change_me_readonly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./docker/init-db.sql:/docker-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
